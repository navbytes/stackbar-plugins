name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds every plugin against the pinned StackbarKit, checks the house rules
  # and renders every surface. Pull requests from forks need no secrets here.
  linux:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: apt-get update -qq && apt-get install -y -qq python3 > /dev/null
      - name: Check
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            scripts/check.sh --base "origin/$GITHUB_BASE_REF"
          else
            scripts/check.sh
          fi

  # The same on a Mac, plus a short soak of each plugin in the App Sandbox.
  macos:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: scripts/check.sh
