name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds every plugin against the pinned StackbarKit, checks the house rules
  # and renders every surface. Pull requests from forks need no secrets here.
  linux:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    container: swift:6.2
    timeout-minutes: 30
    env:
      STACKBAR_REPO_TOKEN: ${{ secrets.STACKBAR_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: apt-get update -qq && apt-get install -y -qq python3 > /dev/null
      # An organization's copy whose Stackbar repository is private
      # (stackbar's docs/self-hosting.md); upstream has no such secret.
      - name: Private Stackbar copy
        if: env.STACKBAR_REPO_TOKEN != ''
        run: scripts/fetch-stackbar.sh .stackbar >> "$GITHUB_ENV"
      - name: No store override upstream
        if: github.repository == 'navbytes/stackbar-plugins'
        run: |
          if [ -e store.override.json ]; then
            echo "::error::store.override.json is for an organization's own copy; remove it"
            exit 1
          fi
      - name: Check
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            scripts/check.sh --base "origin/$GITHUB_BASE_REF"
          else
            scripts/check.sh
          fi

  # Whether this change needs the Mac (.github/scripts/changes.sh): a change
  # to READMEs, docs or the publish scripts doesn't. Manual runs, and pushes
  # we can't diff, run it.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.decide.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            .github/scripts/changes.sh --all
          else
            git diff --name-only "$BASE...$HEAD" | tee /dev/stderr | .github/scripts/changes.sh
          fi | tee -a "$GITHUB_OUTPUT"

  # The same on a Mac, plus a short soak of each plugin in the App Sandbox.
  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    # Each plugin soaks for a minute, so this grows with the store: 34
    # plugins took the whole 45 minutes on 11-06 and the job was cancelled
    # after "check: ok".
    timeout-minutes: 75
    env:
      STACKBAR_REPO_TOKEN: ${{ secrets.STACKBAR_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # An organization's copy whose Stackbar repository is private
      # (stackbar's docs/self-hosting.md); upstream has no such secret.
      - name: Private Stackbar copy
        if: env.STACKBAR_REPO_TOKEN != ''
        run: scripts/fetch-stackbar.sh .stackbar >> "$GITHUB_ENV"
      # A pull request soaks only the plugins it changed; a push to main
      # soaks them all, so a StackbarKit pin change is soaked there.
      - run: scripts/check.sh
        env:
          SOAK_CHANGED_SINCE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

  # One check that is green when every job that ran passed and the rest were
  # skipped on purpose. Make this the required status check, not the jobs
  # above, since a skipped job never reports.
  ok:
    name: CI ok
    if: always()
    needs: [linux, changes, macos]
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
