name: Publish

# Signs new plugin versions with the navbytes key and rebuilds the signed
# index on the gh-pages branch, which GitHub Pages serves at
# https://navbytes.github.io/stackbar-plugins/index.json.
on:
  push:
    branches: [main]
    # Nothing here changes a bundle, a README or the index, so a push of only
    # these skips the Mac. Plugin READMEs are not ignored (site.json reads them).
    paths-ignore: ['*.md', LICENSE, .gitignore, Tests/**, .github/scripts/**, .github/workflows/ci.yml, .github/workflows/canary.yml, scripts/check.sh, scripts/lint.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 45
    # The key is only available to jobs in this environment, which only main
    # may use (Settings → Environments → release).
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check out gh-pages
        run: |
          if git ls-remote --exit-code origin gh-pages > /dev/null; then
            git fetch --depth 1 origin gh-pages
            git worktree add site origin/gh-pages
            cd site && git checkout -B gh-pages
          else
            git worktree add --detach site
            cd site && git checkout --orphan gh-pages && git rm -rfq .
          fi
      - name: Sign and index
        env:
          STACKBAR_PUBLISHER_KEY: ${{ secrets.STACKBAR_PUBLISHER_KEY }}
        run: |
          if [ -z "$STACKBAR_PUBLISHER_KEY" ]; then
            echo "::warning::STACKBAR_PUBLISHER_KEY is not set; nothing published"
            exit 0
          fi
          umask 077
          printf '%s' "$STACKBAR_PUBLISHER_KEY" > "$RUNNER_TEMP/publisher.key"
          scripts/publish.sh site "$RUNNER_TEMP/publisher.key"
          rm -f "$RUNNER_TEMP/publisher.key"
      # Through the GitHub API rather than `git push`, so GitHub signs the
      # commit and it shows as Verified (scripts/push-signed.py).
      - name: Push gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd site
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          if git rev-parse -q --verify HEAD > /dev/null; then
            ../scripts/push-signed.py . gh-pages "Publish ${GITHUB_SHA::7}"
          else
            # First publish ever: the branch has to exist before the API can
            # move it, so this one commit goes up unsigned.
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Publish ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi
