name: Canary

# Builds every plugin against stackbar's main branch each night, so a
# StackbarKit change that breaks a plugin shows up before it is released.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  main:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: navbytes/stackbar
          path: .stackbar
      - run: apt-get update -qq && apt-get install -y -qq python3 > /dev/null
      - run: scripts/check.sh
        env:
          STACKBAR_PATH: ${{ github.workspace }}/.stackbar
      - name: Open an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Canary: plugins don't build against stackbar main";
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "canary" });
            if (open.data.some(issue => issue.title === title)) return;
            await github.rest.issues.create({ ...context.repo, title, labels: ["canary"],
              body: `The nightly build against navbytes/stackbar main failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
